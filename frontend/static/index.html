<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice RAG — Hindi / Marathi / English</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #9aa4b2; --accent: #6ea8fe; --good: #4ade80;
    --warn: #fbbf24; --bad: #f87171; --mono: ui-monospace, SFMono-Regular,
    Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; }
  .badges { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--panel);
  }
  .badge.on { color: var(--good); border-color: #2c5c3f; }
  .badge.off { color: var(--bad); border-color: #5c2c2c; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-top: 16px;
  }
  .row { display: flex; gap: 10px; align-items: stretch; }
  input[type=text] {
    flex: 1; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 11px 13px; font-size: 15px;
    min-width: 0;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #08121f; border: 0; border-radius: 9px;
    padding: 11px 16px; font-size: 14px; font-weight: 620; cursor: pointer;
    white-space: nowrap;
  }
  button.ghost {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  }
  button.rec { background: var(--bad); color: #1b0d0d; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .examples { margin-top: 11px; display: flex; gap: 7px; flex-wrap: wrap; }
  .ex {
    font-size: 12.5px; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
  }
  .ex:hover { color: var(--text); border-color: var(--accent); }
  .ex b { color: var(--accent); font-weight: 600; }

  .answer { font-size: 17px; line-height: 1.65; white-space: pre-wrap; }
  .answer.pending { color: var(--muted); }
  .mode {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    font-family: var(--mono); margin-bottom: 9px;
  }
  .mode.generated  { background: #16351f; color: var(--good); }
  .mode.extractive { background: #3a2f10; color: var(--warn); }
  .mode.refused    { background: #3a1616; color: var(--bad); }

  .timings { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 13px; }
  .t {
    font-family: var(--mono); font-size: 11.5px; padding: 3px 8px;
    border-radius: 6px; background: var(--panel2); border: 1px solid var(--line);
    color: var(--muted);
  }
  .t b { color: var(--text); font-weight: 600; }
  .t.hero { border-color: #2c5c3f; }
  .t.hero b { color: var(--good); }

  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .src {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 13px; margin-bottom: 9px;
  }
  .src-h {
    display: flex; gap: 9px; align-items: center; font-family: var(--mono);
    font-size: 11px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap;
  }
  .lang {
    padding: 1px 6px; border-radius: 4px; background: #1f2937; color: var(--accent);
  }
  .src-t { font-size: 13.5px; color: #cbd3e0; }

  table.g { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.g td { padding: 5px 7px; border-bottom: 1px solid var(--line); }
  table.g td:first-child { font-family: var(--mono); color: var(--muted); width: 96px; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  .err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 9px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice RAG</h1>
    <span class="sub">Hindi &middot; Marathi &middot; English</span>
    <div class="badges" id="badges"></div>
  </header>

  <div class="card">
    <div class="row">
      <input id="q" type="text" autocomplete="off"
             placeholder="Ask a question, or hold the mic and speak…" />
      <button id="ask">Ask</button>
      <button id="mic" class="ghost" title="Record a question">Mic</button>
    </div>
    <div class="examples" id="examples"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card" id="answerCard" style="display:none">
    <div id="mode"></div>
    <div class="answer" id="answer"></div>
    <div class="timings" id="timings"></div>
  </div>

  <div class="card" id="guardCard" style="display:none">
    <h3>Guardrails</h3>
    <table class="g"><tbody id="guards"></tbody></table>
  </div>

  <div class="card" id="srcCard" style="display:none">
    <h3 id="srcHead">Retrieved sources</h3>
    <div id="sources"></div>
  </div>
</div>

<script>
const EXAMPLES = [
  ["en", "how much does a hip replacement cost?"],
  ["hi", "मैनहट्टन परियोजना क्या थी?"],
  ["mr", "मॅनहॅटन प्रकल्प काय होता?"],
  ["en", "what is a corporation?"],
];

const $ = id => document.getElementById(id);
let busy = false;

// ---- examples -------------------------------------------------------------
EXAMPLES.forEach(([lang, text]) => {
  const b = document.createElement("button");
  b.className = "ex";
  b.innerHTML = `<b>${lang}</b> &nbsp;${text}`;
  b.onclick = () => { $("q").value = text; ask(); };
  $("examples").appendChild(b);
});

// ---- health ---------------------------------------------------------------
async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    const langs = (h.config?.languages || []).join(" / ");
    const enc = h.config?.encoder || {};
    const badges = [
      [h.ready ? "ready" : "starting…", h.ready],
      [h.stt_available ? "voice on" : "voice off (no key)", h.stt_available],
      [h.llm_available ? (h.llm?.model || "llm") : "llm off", h.llm_available],
    ];
    $("badges").innerHTML = badges.map(
      ([t, on]) => `<span class="badge ${on ? "on" : "off"}">${t}</span>`).join("")
      + `<span class="badge">${langs}</span>`
      + `<span class="badge">${enc.dim}d ${enc.precision}</span>`;
    const n = h.indexes?.dense?.total_vectors;
    if (n) $("hint").textContent =
      `${n.toLocaleString()} chunks indexed across ${langs}. ` +
      `The grounded extractive answer arrives first; the generated answer streams in after.`;
    if (!h.ready) setTimeout(health, 2500);
  } catch (e) { setTimeout(health, 3000); }
}
health();

// ---- rendering ------------------------------------------------------------
const HERO = new Set(["first_answer_ms", "retrieval_ms", "total_ms", "ttft_ms"]);
const ORDER = ["stt_ms", "encode_ms", "dense_ms", "sparse_ms", "fuse_ms",
               "hydrate_ms", "retrieval_ms", "extractive_ms", "first_answer_ms",
               "ttft_ms", "generation_ms", "total_ms"];

function showTimings(t) {
  if (!t) return;
  const keys = ORDER.filter(k => t[k] !== undefined && t[k] !== null);
  $("timings").innerHTML = keys.map(k => {
    const label = k.replace(/_ms$/, "");
    const v = typeof t[k] === "number" ? t[k].toFixed(1) : t[k];
    return `<span class="t ${HERO.has(k) ? "hero" : ""}">${label} <b>${v}ms</b></span>`;
  }).join("");
}

function showMode(mode, degradedReason, confidence) {
  const label = { generated: "LLM answer", extractive: "extractive (verbatim)",
                  refused: "declined" }[mode] || mode;
  let extra = "";
  if (degradedReason) extra = ` &middot; fallback: ${degradedReason}`;
  if (confidence?.level) extra += ` &middot; retrieval confidence: ${confidence.level}`;
  $("mode").innerHTML = `<span class="mode ${mode}">${label}${extra}</span>`;
}

function showGuards(guards) {
  if (!guards || !guards.length) { $("guardCard").style.display = "none"; return; }
  $("guards").innerHTML = guards.map(g => {
    const s = g.signals || {};
    const bits = [];
    if (s.best_cosine !== undefined) bits.push(`cos ${s.best_cosine}`);
    if (s.confidence?.level) bits.push(`conf ${s.confidence.level}`);
    if (s.groundedness !== undefined) bits.push(`grounded ${s.groundedness}`);
    if (s.sufficient !== undefined) bits.push(`sufficient ${s.sufficient}`);
    if (s.script) bits.push(s.script);
    return `<tr><td>${g.stage}</td>
      <td class="${g.allowed ? "ok" : "no"}">${g.allowed ? "pass" : "BLOCK"}</td>
      <td>${g.reason}</td><td style="color:var(--muted)">${bits.join(" · ")}</td></tr>`;
  }).join("");
  $("guardCard").style.display = "";
}

function showSources(sources) {
  if (!sources || !sources.length) { $("srcCard").style.display = "none"; return; }
  $("srcHead").textContent = `Retrieved sources (${sources.length})`;
  $("sources").innerHTML = sources.map(s => `
    <div class="src">
      <div class="src-h">
        <span class="lang">${s.lang || "?"}</span>
        <span>${s.chunk_id}</span>
        <span>rrf ${(s.rrf_score ?? 0).toFixed(4)}</span>
        ${s.dense_rank ? `<span>dense #${s.dense_rank}</span>` : ""}
        ${s.sparse_rank ? `<span>sparse #${s.sparse_rank}</span>` : ""}
      </div>
      <div class="src-t">${escapeHtml((s.text || "").slice(0, 320))}</div>
    </div>`).join("");
  $("srcCard").style.display = "";
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
                                       '"': "&quot;", "'": "&#39;" }[c]));
}

function reset() {
  $("answerCard").style.display = "";
  $("answer").className = "answer pending";
  $("answer").textContent = "searching…";
  $("mode").innerHTML = "";
  $("timings").innerHTML = "";
  $("guardCard").style.display = "none";
  $("srcCard").style.display = "none";
}

function fail(msg) {
  $("answer").className = "answer err";
  $("answer").textContent = msg;
}

// ---- streaming query ------------------------------------------------------
async function ask(blob) {
  const text = $("q").value.trim();
  if (!text && !blob) return;
  if (busy) return;
  busy = true; $("ask").disabled = true;
  reset();

  const fd = new FormData();
  if (text) fd.append("text", text);
  if (blob) fd.append("audio", blob, "voice.webm");
  fd.append("top_k", "5");

  let generated = "";
  let timing = {};
  try {
    const res = await fetch("/api/query/stream", { method: "POST", body: fd });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        let ev = null, data = null;
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) ev = line.slice(7).trim();
          else if (line.startsWith("data: ")) data = JSON.parse(line.slice(6));
        }
        if (!ev || !data) continue;

        if (ev === "transcript") {
          $("q").value = data.text;
          timing = { ...timing, stt_ms: data.stt_ms };
          showTimings(timing);
        } else if (ev === "retrieval") {
          timing = { ...timing, ...data.timing };
          showSources(data.sources);
          showTimings(timing);
        } else if (ev === "extractive") {
          timing = { ...timing, first_answer_ms: data.first_answer_ms };
          $("answer").className = "answer";
          $("answer").textContent = data.answer;
          showMode("extractive");
          showTimings(timing);
        } else if (ev === "token") {
          if (!generated) { $("answer").textContent = ""; showMode("generated"); }
          generated += data.delta;
          $("answer").textContent = generated;
        } else if (ev === "done") {
          timing = { ...timing, ...(data.timing || {}) };
          $("answer").className = "answer";
          $("answer").textContent = data.answer;
          showMode(data.answer_mode, data.degraded_reason, data.confidence);
          showGuards(data.guardrails);
          if (data.sources) showSources(data.sources);
          showTimings(timing);
        } else if (ev === "error") {
          fail(data.error);
        }
      }
    }
  } catch (e) {
    fail("Request failed: " + e.message);
  } finally {
    busy = false; $("ask").disabled = false;
  }
}

$("ask").onclick = () => ask();
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

// ---- microphone -----------------------------------------------------------
let recorder = null, chunks = [];

$("mic").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // WebM/Opus is what browsers actually produce; the backend maps the
    // container extension to the codec hint Sarvam expects.
    const mime = MediaRecorder.isTypeSupported("audio/webm")
      ? "audio/webm" : "";
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime })
                    : new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").textContent = "Mic";
      $("mic").className = "ghost";
      if (chunks.length) ask(new Blob(chunks, { type: mime || "audio/webm" }));
    };
    recorder.start();
    $("mic").textContent = "Stop";
    $("mic").className = "rec";
  } catch (e) {
    $("hint").innerHTML = `<span class="err">Microphone unavailable: ${e.message}</span>`;
  }
};
</script>
</body>
</html>
